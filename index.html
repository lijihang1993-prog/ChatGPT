<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电费自动计算器</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #f4f8ff, #eef3ff);
      color: #1d2a44;
      padding: 24px 0;
    }
    .card {
      width: min(860px, 92vw);
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 28px rgba(21, 40, 95, 0.12);
      padding: 24px;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 1.5rem;
    }
    .hint {
      margin-top: 0;
      color: #5d6a84;
      font-size: 0.95rem;
    }
    .formula-switch {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 14px 0 18px;
    }
    .formula-btn {
      border: 1px solid #c5d3f5;
      background: #f7f9ff;
      color: #28408f;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    .formula-btn:hover {
      background: #edf2ff;
    }
    .formula-btn.active {
      background: #3155c9;
      border-color: #3155c9;
      color: #fff;
    }
    .formula-box {
      margin-bottom: 14px;
      background: #f9fbff;
      border: 1px solid #dde6ff;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
      line-height: 1.45;
      color: #33456f;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 16px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #c5d3f5;
      font-size: 1rem;
      outline: none;
    }
    input:focus {
      border-color: #5f7be4;
      box-shadow: 0 0 0 3px rgba(95, 123, 228, 0.15);
    }
    input::placeholder {
      font-size: 0.82rem;
      color: #7a88a8;
    }
    .actions {
      margin-top: 18px;
      display: flex;
      justify-content: flex-start;
    }
    .calc-btn {
      border: none;
      border-radius: 10px;
      background: #2f53c3;
      color: white;
      font-size: 1rem;
      padding: 10px 20px;
      cursor: pointer;
    }
    .calc-btn:hover {
      background: #2345af;
    }
    .clear-btn {
      margin-left: 10px;
      border: 1px solid #c5d3f5;
      border-radius: 10px;
      background: #f7f9ff;
      color: #28408f;
      font-size: 1rem;
      padding: 10px 20px;
      cursor: pointer;
    }
    .clear-btn:hover {
      background: #edf2ff;
    }
    .result {
      margin-top: 18px;
      background: #f6f9ff;
      border: 1px solid #d7e3ff;
      border-radius: 12px;
      padding: 16px;
      font-size: 1.1rem;
    }
    .sub-title {
      font-size: 0.92rem;
      color: #50608a;
      margin-bottom: 6px;
    }
    .formula-expression {
      word-break: break-all;
      font-family: "SFMono-Regular", Menlo, Consolas, monospace;
      color: #2a3b66;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }
    .amount {
      font-size: 1.8rem;
      color: #233a85;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>电费自动计算器</h1>
    <p class="hint">先选择公式，输入 7 个参数后点击“计算”展示结果。留空默认按 0 计算。</p>

    <section class="formula-switch">
      <button class="formula-btn active" type="button" data-formula="1">公式一</button>
      <button class="formula-btn" type="button" data-formula="2">公式二</button>
      <button class="formula-btn" type="button" data-formula="3">公式三</button>
    </section>

    <section class="formula-box">
      <div><strong>当前选用公式：</strong></div>
      <div id="formulaText">电费 = Q<sub>实时</sub>*P<sub>实时</sub> + Q<sub>日前</sub>*(P<sub>日前</sub>-P<sub>实时</sub>) + Q<sub>中长期</sub>*(P<sub>中长期</sub>-P<sub>结算参考点</sub>)</div>
    </section>

    <section class="grid">
      <div>
        <label for="qRealtime">Q<sub>实时</sub></label>
        <input id="qRealtime" type="number" step="any" placeholder="请输入 Q₍实时₎" />
      </div>
      <div>
        <label for="pRealtime">P<sub>实时</sub></label>
        <input id="pRealtime" type="number" step="any" placeholder="请输入 P₍实时₎" />
      </div>
      <div>
        <label for="qDayAhead">Q<sub>日前</sub></label>
        <input id="qDayAhead" type="number" step="any" placeholder="请输入 Q₍日前₎" />
      </div>
      <div>
        <label for="pDayAhead">P<sub>日前</sub></label>
        <input id="pDayAhead" type="number" step="any" placeholder="请输入 P₍日前₎" />
      </div>
      <div>
        <label for="qLongTerm">Q<sub>中长期</sub></label>
        <input id="qLongTerm" type="number" step="any" placeholder="请输入 Q₍中长期₎" />
      </div>
      <div>
        <label for="pLongTerm">P<sub>中长期</sub></label>
        <input id="pLongTerm" type="number" step="any" placeholder="请输入 P₍中长期₎" />
      </div>
      <div>
        <label for="pSettlementRef">P<sub>结算参考点</sub></label>
        <input id="pSettlementRef" type="number" step="any" placeholder="请输入 P₍结算参考点₎" />
      </div>
    </section>

    <div class="actions">
      <button class="calc-btn" id="calculateBtn" type="button">计算</button>
      <button class="clear-btn" id="clearBtn" type="button">清空</button>
    </div>

    <section class="result">
      <div class="sub-title">代入数值后的公式</div>
      <div class="formula-expression" id="formulaExpression">-</div>
      <div>电费</div>
      <div class="amount" id="powerFee">0.000</div>
    </section>
  </main>

  <script>
    const formulaMap = {
      1: {
        text: '电费 = Q<sub>实时</sub>*P<sub>实时</sub> + Q<sub>日前</sub>*(P<sub>日前</sub>-P<sub>实时</sub>) + Q<sub>中长期</sub>*(P<sub>中长期</sub>-P<sub>结算参考点</sub>)',
        expression: ({ qRealtime, pRealtime, qDayAhead, pDayAhead, qLongTerm, pLongTerm, pSettlementRef }) =>
          `${qRealtime}*${pRealtime}+${qDayAhead}*(${pDayAhead}-${pRealtime})+${qLongTerm}*(${pLongTerm}-${pSettlementRef})`,
        calculate: ({ qRealtime, pRealtime, qDayAhead, pDayAhead, qLongTerm, pLongTerm, pSettlementRef }) =>
          qRealtime * pRealtime +
          qDayAhead * (pDayAhead - pRealtime) +
          qLongTerm * (pLongTerm - pSettlementRef)
      },
      2: {
        text: '电费 = Q<sub>日前</sub>*P<sub>日前</sub> + (Q<sub>实时</sub>-Q<sub>日前</sub>)*P<sub>实时</sub> + Q<sub>中长期</sub>*(P<sub>中长期</sub>-P<sub>结算参考点</sub>)',
        expression: ({ qRealtime, pRealtime, qDayAhead, pDayAhead, qLongTerm, pLongTerm, pSettlementRef }) =>
          `${qDayAhead}*${pDayAhead}+(${qRealtime}-${qDayAhead})*${pRealtime}+${qLongTerm}*(${pLongTerm}-${pSettlementRef})`,
        calculate: ({ qRealtime, pRealtime, qDayAhead, pDayAhead, qLongTerm, pLongTerm, pSettlementRef }) =>
          qDayAhead * pDayAhead +
          (qRealtime - qDayAhead) * pRealtime +
          qLongTerm * (pLongTerm - pSettlementRef)
      },
      3: {
        text: '电费 = Q<sub>中长期</sub>*P<sub>中长期</sub> + Q<sub>中长期</sub>*(P<sub>日前</sub>-P<sub>结算参考点</sub>) + (Q<sub>日前</sub>-Q<sub>中长期</sub>)*P<sub>日前</sub> + (Q<sub>实时</sub>-Q<sub>日前</sub>)*P<sub>实时</sub>',
        expression: ({ qRealtime, pRealtime, qDayAhead, pDayAhead, qLongTerm, pLongTerm, pSettlementRef }) =>
          `${qLongTerm}*${pLongTerm}+${qLongTerm}*(${pDayAhead}-${pSettlementRef})+(${qDayAhead}-${qLongTerm})*${pDayAhead}+(${qRealtime}-${qDayAhead})*${pRealtime}`,
        calculate: ({ qRealtime, pRealtime, qDayAhead, pDayAhead, qLongTerm, pLongTerm, pSettlementRef }) =>
          qLongTerm * pLongTerm +
          qLongTerm * (pDayAhead - pSettlementRef) +
          (qDayAhead - qLongTerm) * pDayAhead +
          (qRealtime - qDayAhead) * pRealtime
      }
    };

    const fieldIds = ['qRealtime', 'pRealtime', 'qDayAhead', 'pDayAhead', 'qLongTerm', 'pLongTerm', 'pSettlementRef'];
    let activeFormula = 1;

    const number = (id) => {
      const value = parseFloat(document.getElementById(id).value);
      return Number.isFinite(value) ? value : 0;
    };

    const values = () => ({
      qRealtime: number('qRealtime'),
      pRealtime: number('pRealtime'),
      qDayAhead: number('qDayAhead'),
      pDayAhead: number('pDayAhead'),
      qLongTerm: number('qLongTerm'),
      pLongTerm: number('pLongTerm'),
      pSettlementRef: number('pSettlementRef')
    });

    const setFormula = (formulaId) => {
      activeFormula = formulaId;
      document.querySelectorAll('.formula-btn').forEach((btn) => {
        btn.classList.toggle('active', Number(btn.dataset.formula) === formulaId);
      });
      document.getElementById('formulaText').innerHTML = formulaMap[formulaId].text;
    };

    const calculate = () => {
      const input = values();
      const selected = formulaMap[activeFormula];
      const expression = selected.expression(input);
      const powerFee = selected.calculate(input);

      document.getElementById('formulaExpression').textContent = expression;
      document.getElementById('powerFee').textContent = powerFee.toLocaleString('zh-CN', {
        minimumFractionDigits: 3,
        maximumFractionDigits: 3
      });
    };

    document.querySelectorAll('.formula-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        setFormula(Number(btn.dataset.formula));
      });
    });

    fieldIds.forEach((id) => {
      document.getElementById(id).addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          calculate();
        }
      });
    });

    const clear = () => {
      fieldIds.forEach((id) => {
        document.getElementById(id).value = "";
      });
      document.getElementById('formulaExpression').textContent = "-";
      document.getElementById('powerFee').textContent = "0.000";
    };

    document.getElementById('calculateBtn').addEventListener('click', calculate);
    document.getElementById('clearBtn').addEventListener('click', clear);
    setFormula(1);
  </script>
</body>
</html>
