<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电费自动计算器</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #f4f8ff, #eef3ff);
      color: #1d2a44;
    }
    .card {
      width: min(720px, 92vw);
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 28px rgba(21, 40, 95, 0.12);
      padding: 24px;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 1.5rem;
    }
    .hint {
      margin-top: 0;
      color: #5d6a84;
      font-size: 0.95rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 16px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #c5d3f5;
      font-size: 1rem;
      outline: none;
    }
    input:focus {
      border-color: #5f7be4;
      box-shadow: 0 0 0 3px rgba(95, 123, 228, 0.15);
    }
    .result {
      margin-top: 20px;
      background: #f6f9ff;
      border: 1px solid #d7e3ff;
      border-radius: 12px;
      padding: 16px;
      font-size: 1.1rem;
    }
    .amount {
      font-size: 1.8rem;
      color: #233a85;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>电费自动计算器</h1>
    <p class="hint">输入 7 个参数后将自动计算“电费”。留空默认按 0 计算。</p>

    <section class="grid">
      <div>
        <label for="qRealtime">Q实时</label>
        <input id="qRealtime" type="number" step="any" placeholder="请输入 Q实时" />
      </div>
      <div>
        <label for="pRealtime">P实时</label>
        <input id="pRealtime" type="number" step="any" placeholder="请输入 P实时" />
      </div>
      <div>
        <label for="qDayAhead">Q日前</label>
        <input id="qDayAhead" type="number" step="any" placeholder="请输入 Q日前" />
      </div>
      <div>
        <label for="pDayAhead">P日前</label>
        <input id="pDayAhead" type="number" step="any" placeholder="请输入 P日前" />
      </div>
      <div>
        <label for="qLongTerm">Q中长期</label>
        <input id="qLongTerm" type="number" step="any" placeholder="请输入 Q中长期" />
      </div>
      <div>
        <label for="pLongTerm">P中长期</label>
        <input id="pLongTerm" type="number" step="any" placeholder="请输入 P中长期" />
      </div>
      <div>
        <label for="pSettlementRef">P结算参考点</label>
        <input id="pSettlementRef" type="number" step="any" placeholder="请输入 P结算参考点" />
      </div>
    </section>

    <section class="result">
      <div>电费</div>
      <div class="amount" id="powerFee">0.00</div>
    </section>
  </main>

  <script>
    const fields = [
      'qRealtime',
      'pRealtime',
      'qDayAhead',
      'pDayAhead',
      'qLongTerm',
      'pLongTerm',
      'pSettlementRef'
    ];

    const number = (id) => {
      const value = parseFloat(document.getElementById(id).value);
      return Number.isFinite(value) ? value : 0;
    };

    const calculate = () => {
      const qRealtime = number('qRealtime');
      const pRealtime = number('pRealtime');
      const qDayAhead = number('qDayAhead');
      const pDayAhead = number('pDayAhead');
      const qLongTerm = number('qLongTerm');
      const pLongTerm = number('pLongTerm');
      const pSettlementRef = number('pSettlementRef');

      const powerFee =
        qRealtime * pRealtime +
        qDayAhead * (pDayAhead - pRealtime) +
        qLongTerm * (pLongTerm - pSettlementRef);

      document.getElementById('powerFee').textContent = powerFee.toLocaleString('zh-CN', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    };

    fields.forEach((id) => {
      document.getElementById(id).addEventListener('input', calculate);
    });

    calculate();
  </script>
</body>
</html>
