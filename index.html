<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>按钮变色</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f5f5;
        font-family: Arial, sans-serif;
      }

      #toggleButton {
        border: none;
        color: #fff;
        width: 140px;
        height: 56px;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
        background: #e53935;
      }
    </style>
  </head>
  <body>
    <button id="toggleButton" aria-label="颜色切换按钮">点我切换颜色</button>

    <script>
      const button = document.getElementById('toggleButton');
      let isRed = true;

      button.addEventListener('click', () => {
        isRed = !isRed;
        button.style.background = isRed ? '#e53935' : '#43a047';
      });
    </script>
  </body>
</html>
